name: Python wheels

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  matrix:
    name: Select supported Python versions
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      uv-version: ${{ steps.uv.outputs.uv-version }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        id: uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # Refresh the interpreter catalogue, then use this same uv version in every job.
          version: latest
          enable-cache: false
      - name: Select matrix from requires-python
        id: matrix
        run: uv run --no-project --python 3.13 --with packaging .github/scripts/python_matrix.py

  build:
    name: Python ${{ matrix.label }} on ${{ matrix.name }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv and the matrix interpreter
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ needs.matrix.outputs.uv-version }}
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Install test dependencies
        run: uv sync --locked --only-group test
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          rust-toolchain: stable
          target: ${{ matrix.target }}
          args: --out dist --interpreter ${{ matrix.interpreter }} --generate-stubs
          manylinux: "2014"
      - name: Check wheel contents
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, f"Expected one wheel, found {wheels}"
          with ZipFile(wheels[0]) as wheel:
              assert "lophat/__init__.pyi" in wheel.namelist(), "Generated stubs are missing"
          PY
      - name: Install the built wheel
        run: >-
          uv pip install --python .venv --no-index --find-links dist
          --only-binary :all: --no-deps lophat
      - name: Test the installed wheel
        run: uv run --no-sync pytest
      - name: Upload tested release wheel
        if: github.event_name == 'release' && github.event.release.target_commitish == 'main'
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.name }}-${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish tested wheels to PyPI
    if: github.event_name == 'release' && github.event.release.target_commitish == 'main'
    needs: [matrix, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ needs.matrix.outputs.uv-version }}
          enable-cache: false
      - name: Download tested wheels
        uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish wheels
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple dist/*.whl
